name: Build & Deploy rocktreff.de

on:
  push:
    branches:
      - main

env:
  HUGO_VERSION: "0.162.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: false

      # Hugo generates WebP variants into resources/_gen. Encoding all
      # images from scratch is slow, so reuse the previous run's output and
      # only encode new or changed images.
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-${{ env.HUGO_VERSION }}-gen-${{ hashFiles('assets/**', 'layouts/partials/img/**') }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-gen-

      - name: Build
        run: hugo --environment production --minify --gc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
