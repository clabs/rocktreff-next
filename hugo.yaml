baseURL: "https://rocktreff.de"
locale: "de-DE"
defaultContentLanguage: de
title: "ROCKTREFF"

params:
  email: "kontakt@rocktreff.de"
  currentYear: 2027
  # bewerbungEnde is the last day bands can apply (YYYY-MM-DD).
  bewerbungEnde: 2027-01-15
  # bewerbungPhase controls the band application widget.
  # Values: "open" | "teaser" | "geschlossen" | "" (empty = hidden)
  bewerbungPhase: "open"
  # showVerbote shows the prohibited-items section (only needed before the event).
  showVerbote: false

markup:
  goldmark:
    renderer:
      unsafe: true

disableKinds:
  - rss
  - taxonomy
  - term
